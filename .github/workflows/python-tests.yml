name: Python CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest jsonschema httpx "numpy<2" scipy pillow "jax[cpu]"
      - name: Run tests
        run: |
          pytest -q tests/test_stage5_stage6.py tests/test_runner_smoke.py tests/test_stage4_multimodal.py tests/test_stage6_learning.py 2>&1 | tail -40
          echo "--- pip versions ---"
          pip list 2>/dev/null | grep -i -E "jax|numpy|scipy|pytest" 
